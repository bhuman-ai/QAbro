schema_version: 1
product:
  name: "Before Users Do"
  url: "https://beforeusersdo.com"
  repository: "https://github.com/bhuman-ai/QAbro"
facts:
  - "Before Users Do is a hosted QA MCP and companion agent skill for coding agents."
  - "The hosted MCP endpoint at https://mcp.beforeusersdo.com/mcp is publicly reachable and correctly requires authentication."
  - "A schema-valid server.json now describes the hosted MCP server for official Registry publication."
  - "The official MCP Registry lists io.github.bhuman-ai/beforeusersdo version 1.0.0 as active and latest, published on 2026-07-30."
  - "The crawler-visible https://beforeusersdo.com/qa-mcp acquisition page, robots.txt, and sitemap.xml are live from production commit 7f69e358."
  - "A controlled production visit verified the /qa-mcp offer view and install CTA as two stitched is_test=true events before reaching focused sign-up."
  - "The public GitHub repository now links to /qa-mcp and carries QA MCP, browser-testing, and coding-agent discovery topics."
  - "The homepage and public docs use Install BeforeUsersDo as the primary customer CTA."
  - "The existing self-serve path sends that CTA to /dashboard?panel=coding_agents, then supports sign-in, MCP key creation, MCP configuration, and skill installation."
  - "The product supports AI testing, owner self-review, team handoff, and human tester requests."
  - "QA reports can include browser evidence such as screenshots, console errors, network proof, and fix-ready findings."
  - "https://beforeusersdo.com returned HTTP 200 from the production Vercel deployment on 2026-07-30."
  - "No dedicated acquisition analytics provider or UTM attribution implementation was found in the inspected product source."
  - "The acquisition event journal and milestone triggers were applied to production Supabase on 2026-07-30."
  - "A synthetic test campaign verified browser arrival, CTA, install-copy, MCP key, MCP first-use, QA request, and completed-report events with first-touch attribution."
  - "A controlled production account completed the real landing-page-to-report journey on 2026-07-30; all eight milestones were stitched to one test visitor and the first report completed in 96 seconds."
hypotheses:
  - "AI-assisted founders and small product teams are the fastest initial customer segment."
  - "The strongest trigger is the moment an AI coding agent says a feature is done but the builder lacks trustworthy QA proof."
  - "Official MCP Registry distribution will reach qualified builders at the moment they are looking for new coding-agent capabilities."
  - "Completing a first QA report is a stronger activation signal than account creation or MCP key creation."
unknowns:
  - "Current signup-to-install and install-to-first-report conversion rates."
  - "Which acquisition source, if any, has already produced activated users."
  - "Current customer, usage, retention, or outcome proof that can be used publicly."
  - "Whether the homepage live tester availability count is backed by production data."
  - "The commercial offer or price presented after initial activation."
audience:
  segment: "Founders and small product teams shipping AI-coded web apps with Codex or another MCP-capable coding agent."
  triggering_situation: "A feature or preview looks finished and is about to ship, but the builder does not have trustworthy browser QA evidence."
  painful_job: "Catch bugs, confusing UI, and broken flows without leaving the coding-agent workflow or manually assembling a QA process."
offer:
  promised_outcome: "Catch release-blocking bugs and UX friction before users encounter them, with evidence the coding agent can act on."
  mechanism: "Install one hosted MCP connection and companion skill so the coding agent can route each feature through AI, self, team, or human QA and return a fix-ready report."
  proof:
    - "A production self-serve install path exists for creating an MCP key and copying both setup components."
    - "The repository implements browser-backed QA runs, evidence capture, reports, tester handoff, and alert delivery."
    - "Public documentation describes the complete install and first-test workflow."
  primary_objection: "The setup may feel like extra toolchain work before the user has seen a concrete QA result."
funnel:
  archetype: "self-serve signup"
  primary_cta: "Install BeforeUsersDo"
  steps:
    - "Visit the homepage or public docs."
    - "Choose Install BeforeUsersDo."
    - "Sign in or create an account."
    - "Create an MCP key."
    - "Copy the MCP configuration and install the companion skill."
    - "Ask the coding agent to test one reachable preview."
    - "Receive the first completed QA report."
channel:
  primary: "High-intent organic search for QA MCP and browser-testing MCP queries"
  audience_hypothesis: "Builders searching for a QA MCP or browser testing for coding agents have an active release-confidence problem and compatible tooling."
  distribution_model: "Compounding public search content supported by MCP ecosystem citations"
  reusable_unit: "One crawler-visible /qa-mcp page that explains the QA handoff and routes visitors into the measured install flow."
  expansion_lever: "Search indexing, internal links, the official Registry record, and future ecosystem citations can grow discovery without proportional founder labor."
  manual_dependency: "Occasional proof, copy, and technical metadata updates based on observed search and activation data."
  scalability_floor:
    passes: true
    reason: "One public asset can serve many qualified searches, compound through indexing and citations, and be measured through its landing path."
  experiment:
    landing_path: "/qa-mcp"
    reporting_command: "npm run marketing:report -- --path=/qa-mcp"
    primary_metric: "first_qa_report_completed"
    observation_window: "45 days after publication or until 100 qualified page visitors, whichever is later."
    continue_if: "The page produces at least one completed QA report, or at least five percent of qualified visitors choose the install CTA before the activation sample is large enough."
    stop_or_change_if: "The page is indexed but 100 qualified visitors produce no install CTA clicks, or clicks consistently fail to reach MCP activation."
  budget:
    currency: USD
    daily_cap: null
    total_cap: null
  launch_seed:
    channel: "Product Hunt"
    role: "One-to-many launch exposure that sends attributable visitors into the measured homepage install path and supports the compounding /qa-mcp search asset."
    destination: "https://beforeusersdo.com/?utm_source=product_hunt&utm_medium=launch&utm_campaign=qa_mcp_launch"
    reusable_unit: "One Product Hunt product launch with a tracked destination, listing copy, maker comment, thumbnail, and two gallery images."
    expansion_lever: "Product Hunt discovery, ecosystem citations, launch feedback, and reusable launch assets can reach many builders without proportional personalized outreach."
    manual_dependency: "One maker-owned submission, honest maker comment, launch-day replies, and occasional listing updates."
    scalability_floor:
      passes: true
      reason: "One public launch can receive platform-wide exposure and send measurable traffic through one attributed destination."
    status: "package-ready"
measurement:
  primary_event: "first_qa_report_completed"
  analytics_destination: "Existing Supabase project with a planned swarmtest_acquisition_events journal joined to swarmtest_mcp_tokens and swarmtest_reports."
  attribution_model: "First-touch source, medium, and campaign persisted through the first completed QA report."
  diagnostic_events:
    - "offer_viewed"
    - "primary_cta_clicked"
    - "signup_completed"
    - "mcp_key_created"
    - "agent_install_step_copied"
    - "mcp_key_first_used"
    - "first_qa_requested"
    - "first_qa_report_completed"
status: "learning"
current_bottleneck: "insufficient qualified search traffic to evaluate message response or activation"
next_action: "Obtain explicit approval to publish the prepared Product Hunt launch from the maker's personal account."
approvals_needed:
  - "Confirm the maker's personal Product Hunt account and complete the honest one-sentence maker story."
  - "Confirm the truthful Product Hunt pricing tag from the live commercial offer."
  - "Approve any required Product Hunt terms and external publication immediately before submission."
last_verified_at: "2026-07-30T20:24:18Z"
updated_at: "2026-07-30"
