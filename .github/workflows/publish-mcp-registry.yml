name: Publish MCP Registry metadata

on:
  workflow_dispatch:

concurrency:
  group: publish-mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout the approved release metadata
        uses: actions/checkout@v5

      - name: Install the pinned MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --output mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz
          echo "ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac  mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --version

      - name: Authenticate to the MCP Registry with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json version 1.0.0
        run: ./mcp-publisher publish server.json
